server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: cartcraft
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cartcraft}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-strong-256-bit-secret-replace-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/order-success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/cart}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
